[project]
name = "pyjfl"
version = "0.3.0"
description = "Asynchronous client for JFL Active alarm panels — frame codec and TCP listener"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Jonis Maurin Ceará", email = "jmceara@gmail.com" }]
keywords = ["jfl", "active", "alarm", "home-assistant", "asyncio"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
# No runtime dependencies: the package is standard library only.
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "pytest-asyncio", "pyyaml", "ruff"]

[project.urls]
Homepage = "https://github.com/jmceara/pyjfl"
Issues = "https://github.com/jmceara/pyjfl/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyjfl"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "UP", "B", "SIM", "C4", "D", "ANN", "RUF", "PTH", "TRY", "LOG", "G", "T20",
]
ignore = ["D203", "D213", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN202", "D103", "D401"]
# `scripts/` holds command-line programs, where printing is the point.
"scripts/*.py" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.13"
files = ["src/pyjfl"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
norecursedirs = ["fixtures"]
